# RipGrade, Jackett, and a resolver the ISP cannot answer for.
#
# Four services, one of which exits:
#
#   dns           CoreDNS, forwarding every lookup over TLS to Cloudflare.
#   jackett-init  Writes the API key, and seeds indexers into a fresh install.
#                 Runs to completion before Jackett starts, then exits.
#   jackett       The indexer proxy, told to resolve through dns and nothing
#                 else.
#   ripgrade      The app and its five command-line tools, with the drive
#                 bound in.
#
# Why a resolver and not a VPN: the trackers are not blocked by address, they
# are blocked by name. The ISP answers 49.205.171.201 for torrentdownload.info,
# 1337x.to and thepiratebay.org alike — one sinkhole standing in for every
# blocked name — and TLS then fails against a box serving a block page. Aiming
# at 1.1.1.1 does not help, because port 53 is intercepted whatever you aim it
# at. An encrypted query cannot be read, and so cannot be answered for.
#
# A VPN would also have worked, at the cost of a subscription, throughput, and
# signing the machine out of everything else. See docs/Indexer_Connectivity_Fix.md
# for how that was diagnosed, and docs/Docker_Runbook.md for running this.
#
# Copy .env.docker.example to .env and fill it in before the first up.

services:
  dns:
    image: coredns/coredns:latest
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./docker/Corefile:/etc/coredns/Corefile:ro
    networks:
      ripgrade-net:
        # Fixed, because Jackett's `dns:` below is a plain address and has no
        # way to look up the name of the thing that does the looking up. The
        # .53 is a mnemonic for the port.
        ipv4_address: 172.28.0.53
    restart: unless-stopped

  # Runs once, before Jackett, and gives it the API key from .env plus a
  # starter set of public indexers — the two things that otherwise mean opening
  # the dashboard before the app can search anything. Node because these are
  # JSON files holding the whole indexer setup, and patching those with a regex
  # is how you lose them. See docker/jackett-init.mjs.
  jackett-init:
    image: node:22-bookworm-slim
    # Root to write into a config directory it does not own. On a bind mount
    # from macOS the chown afterwards is a no-op, and the script treats it as
    # one rather than failing.
    user: "0:0"
    environment:
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      JACKETT_SEED_INDEXERS: ${JACKETT_SEED_INDEXERS:-}
      PUID: ${PUID:-501}
      PGID: ${PGID:-20}
    volumes:
      - ${JACKETT_CONFIG:-./docker/jackett-config}:/config
      - ./docker/jackett-init.mjs:/jackett-init.mjs:ro
      - ./docker/jackett-indexers:/indexers:ro
    command: ["node", "/jackett-init.mjs"]
    restart: "no"

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    # The whole point. Every name Jackett looks up goes to CoreDNS over TLS;
    # nothing here consults the resolver the ISP hands out.
    dns:
      - 172.28.0.53
    ports:
      - "9117:9117"
    environment:
      TZ: ${TZ:-Europe/London}
    volumes:
      # The config you already have, so the indexers and the key survive. The
      # default is for a machine that has none.
      - ${JACKETT_CONFIG:-./docker/jackett-config}:/config
    networks:
      - ripgrade-net
    depends_on:
      dns:
        condition: service_started
      # The key has to be in the config before Jackett reads it. Afterwards is
      # a restart, and a restart is the thing this exists to avoid.
      jackett-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ripgrade:
    build:
      context: .
    image: ripgrade:local
    ports:
      # 6969 outside, because 3000 belongs to `next dev` and the two want to be
      # runnable at once — the container is the library you keep, not the one
      # you are editing. Inside it is still 3000; nothing about the app cares.
      - "${RIPGRADE_PORT:-6969}:3000"
    volumes:
      # Bound at the same path it has on the host, so every path already in the
      # database still resolves and a library scanned outside the container is
      # the same library inside it. Docker Desktop shares /Volumes by default;
      # if you moved it, Settings → Resources → File sharing.
      - /Volumes:/Volumes
      # Writable: dovi_convert leaves the original beside its result, and the
      # audio strip writes a new MKV next to the file it read.
      - ripgrade-data:/app/data
    environment:
      TZ: ${TZ:-Europe/London}
      RIPGRADE_BROWSE_ROOT: ${RIPGRADE_BROWSE_ROOT:-/Volumes}
      # The other half of the arrangement: the same key jackett-init wrote into
      # Jackett's config, and the address Jackett answers on. Set both and the
      # integration is configured before the first page loads; set neither and
      # the app falls back to Settings, which is what an empty value means.
      #
      # Deliberately not given the CoreDNS resolver: TMDb and Blu-ray.com are
      # not the names anybody is blocking, and the fix stays scoped to the
      # container that needed it.
      JACKETT_URL: ${JACKETT_URL:-}
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
    networks:
      - ripgrade-net
    depends_on:
      - jackett
    restart: unless-stopped

networks:
  ripgrade-net:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ripgrade-data:
