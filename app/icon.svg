<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0b0b0d"/>
  <!-- Film-strip perforations down each edge -->
  <g fill="#ededf0" opacity="0.35">
    <rect x="9" y="15" width="5" height="6" rx="1.5"/>
    <rect x="9" y="29" width="5" height="6" rx="1.5"/>
    <rect x="9" y="43" width="5" height="6" rx="1.5"/>
    <rect x="50" y="15" width="5" height="6" rx="1.5"/>
    <rect x="50" y="29" width="5" height="6" rx="1.5"/>
    <rect x="50" y="43" width="5" height="6" rx="1.5"/>
  </g>
  <!-- Grade gauge: an arc swept most of the way round, the way the score ring reads -->
  <circle cx="32" cy="32" r="13" fill="none" stroke="#ededf0" stroke-opacity="0.18" stroke-width="5"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#34d399" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="81.7" stroke-dashoffset="20"
          transform="rotate(-90 32 32)"/>
</svg>
